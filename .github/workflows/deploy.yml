name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  changepacks:
    name: changepacks
    runs-on: ubuntu-latest
    permissions:
      # create pull request comments
      pull-requests: write

      # Actions > General > Workflow permissions for creating pull request
      # Create brench to create pull request
      contents: write
    needs:
      - check
    steps:
      - uses: actions/checkout@v5
      - uses: changepacks/action@main
        id: changepacks
    outputs:
      changepacks: ${{ steps.changepacks.outputs.changepacks }}

  deploy:
    name: deploy
    needs: changepacks
    if: always() && (needs.changepacks.result == 'success' && contains(needs.changepacks.outputs.changepacks, 'package.json') || github.ref_name == 'dev')
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'PROD' || 'DEV' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Collect API environment variables
        uses: dev-five-git/collect-env-action@main
        with:
          prefix: 'API_ENV_'
          output: 'apis/api/.env'
          remove-prefix: true
          secrets: ${{ toJson(secrets) }}
      - name: Overwrite .env
        uses: dev-five-git/overwrite-env-file-action@main
        if: github.ref_name != 'main'
      - name: compress
        run: |
          # build 
          docker build -f Dockerfile.build -t build:latest .
          CONTAINER_ID=$(docker create build:latest)
          docker cp $CONTAINER_ID:/app/front.tar.gz ./front.tar.gz
          docker cp $CONTAINER_ID:/app/api.tar.gz ./api.tar.gz

          tar -czf deploy.tar.gz api.tar.gz front.tar.gz docker-compose.yml Dockerfile.front Dockerfile.api nginx.conf

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy.tar.gz
          retention-days: 1
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        if: runner.os == 'macOS'
      - name: Install sshpass (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install hudochenkov/sshpass/sshpass
      - name: ssh
        uses: appleboy/ssh-action@master
        env:
          PORT: ${{ secrets.PORT }}
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        with:
          command_timeout: 40m
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: PORT,DOCKER_BUILDKIT,COMPOSE_DOCKER_CLI_BUILD
          script: |
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S chmod -R 777 ~/"${{ github.repository }}"
            BASE_DIR=~/"${{ github.repository }}"
            DIR="$BASE_DIR/${{ github.repository }}_${{ github.ref_name }}"

            mkdir -p "$BASE_DIR"
            mkdir -p "$DIR"
      - name: Scp
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no -P ${{ secrets.SSH_PORT }} deploy.zip ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOSTNAME }}:~/${{ github.repository }}/deploy.tar.gz
      - name: ssh
        uses: appleboy/ssh-action@master
        env:
          PORT: ${{ secrets.PORT }}
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        with:
          command_timeout: 40m
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: PORT,DOCKER_BUILDKIT,COMPOSE_DOCKER_CLI_BUILD
          script: |
            docker buildx create --name devfivebuilder --use
            docker buildx inspect --bootstrap

            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S chmod -R 777 ~/"${{ github.repository }}"

            BASE_DIR=~/"${{ github.repository }}"
            DIR="$BASE_DIR/${{ github.repository }}_${{ github.ref_name }}"

            mkdir -p "$BASE_DIR"
            mkdir -p "$DIR"

            # build 진행해서 캐싱 시작, 기존 서버가 켜져있을 때 build 시작
            cd "$DIR"

            docker compose down --rmi all

            tar -xzf "$BASE_DIR/deploy.tar.gz" -C "$DIR"
            rm -f "$BASE_DIR/deploy.tar.gz"

            cd "$DIR"
            docker compose up -d --build