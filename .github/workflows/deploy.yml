name: Deploy

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: bun install
        run: bun install

      - name: bun run lint
        run: bun -F apps/* lint

      - name: bun run build
        run: bun -F apps/* build

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    needs: check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: compress
        run: tar -zcf deploy.tar.gz .

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy.tar.gz
      - name: scp
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy.tar.gz
          target: ~/deploy.tar.gz

      - name: ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/
            tar -zxf deploy.tar.gz
            rm -rf deploy.tar.gz
            docker compose -f docker-compose.yml up -d