[project]
name = "api"
description = "devfive template api"
version = "0.1.0"
authors = [{ name = "devfive" }]
readme = "README.md"
requires-python = "==3.14.*"

dependencies = [
    "alembic>=1.17.1",
    "auto-import-py>=0.1.0",
    "fastapi>=0.121.0",
    "fastapi-fs-router>=0.1.1",
    "sqlmodel>=0.0.27",
]

[dependency-groups]
dev = ["alembic>=1.16.5", "pytest>=8.4.2", "uvicorn>=0.35.0"]
