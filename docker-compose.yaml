
services:
  postgres:
    image: postgres:17.5-alpine3.22
    container_name: service-template-postgres
    environment:
      POSTGRES_DB: service_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service-network
    restart: unless-stopped

  api:
    build:
      context: ./apis/api
      dockerfile: Dockerfile
    container_name: service-template-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/service_template
    depends_on:
      - postgres
    networks:
      - service-network
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: service-template-admin
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - service-network
    restart: unless-stopped

  front:
    build:
      context: ./apps/front
      dockerfile: Dockerfile
    container_name: service-template-front
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - service-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  service-network:
    driver: bridge
