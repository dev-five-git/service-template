services:
  nginx:
    image: nginx
    restart: always
    ports:
      - ${PORT:-80}:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      api:
        condition: service_healthy
      node:
        condition: service_healthy
  node:
    build:
      dockerfile: Dockerfile.front
    restart: always
    expose:
      - 3000
      - 3001
    ports:
      - "3000:3000"
      - "3001:3001"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://node:3000 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

  api:
    build:
      dockerfile: Dockerfile.api
    restart: always
    expose:
      - 8000
    ports:
      - "8000:8000"
    env_file:
      - path: apis/api/.env
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://api:8000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
