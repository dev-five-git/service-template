events {
    worker_connections 1024;
}

http {
    # MIME types 설정
    include /etc/nginx/mime.types;
    types_hash_max_size 2048;
    types_hash_bucket_size 128;

    types {
        application/javascript mjs;
    }

    # Admin 앱 서버 (dev-admin.*, admin.* 도메인)
    server {
        listen 80;
        server_name ~^(dev-admin|admin)\..+;
        client_max_body_size 20M;

        # 정적 파일 호스팅 (/files/ 경로)
        location /files/ {
            alias /var/files/;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";

            # 파일이 없을 때 404 반환
            try_files $uri $uri/ /;
        }

        # 메인 라우트
        location / {
            proxy_pass http://node:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            types_hash_max_size 4096;
            types_hash_bucket_size 256;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 정적 파일 캐싱
        location ~* ^(?!/files/).*\.(?:css|js|woff2?|eot|ttf|otf|jpg|jpeg|png|gif|ico|svg|webp)$ {
            proxy_pass http://node:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            types_hash_max_size 4096;
            types_hash_bucket_size 256;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # Front 앱 서버 (기본 서버)
    server {
        listen 80 default_server;
        client_max_body_size 20M;

        # 정적 파일 호스팅 (/files/ 경로)
        location /files/ {
            alias /var/files/;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";

            # 파일이 없을 때 404 반환
            try_files $uri $uri/ /;
        }

        # 메인 라우트
        location / {
            proxy_pass http://node:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            types_hash_max_size 4096;
            types_hash_bucket_size 256;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location ~* ^(?!/files/).*\.(?:css|js|woff2?|eot|ttf|otf|jpg|jpeg|png|gif|ico|svg|webp)$ {
            proxy_pass http://node:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            types_hash_max_size 4096;
            types_hash_bucket_size 256;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # API 서버 (dev-api.*, api 도메인)
    server {
        listen 80;
        server_name ~^(dev-api|api)\..+;
        client_max_body_size 20M;

        # 정적 파일 호스팅 (/files/ 경로)
        location /files/ {
            alias /var/files/;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";

            # 파일이 없을 때 404 반환
            try_files $uri $uri/ /;
        }

        # 메인 라우트
        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            types_hash_max_size 4096;
            types_hash_bucket_size 256;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # 정적 파일 캐싱
        location ~* ^(?!/files/).*\.(?:css|js|woff2?|eot|ttf|otf|jpg|jpeg|png|gif|ico|svg|webp)$ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            types_hash_max_size 4096;
            types_hash_bucket_size 256;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}